{% extends 'base.html' %}
{% load static %}

{% block contenido %}
    <h2 class="text-center mb-4">Temáticas Gamer - Backend</h2>

    <!-- Ciclo for para recorrer los temas enviados desde views.py -->
    {% for tema in temas %}
    <div class="card bg-secondary text-white mb-5">
        <div class="card-header">
            <h3>{{ tema.nombre }}</h3>
        </div>
        <div class="card-body">
            <p>{{ tema.descripcion }}</p>
            
            <!-- Carrusel de Bootstrap para las 2 imágenes del tema -->
            <div id="carrusel{{ forloop.counter }}" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="{% static tema.foto1 %}" class="d-block w-100" alt="Foto 1">
                    </div>
                    <div class="carousel-item">
                        <img src="{% static tema.foto2 %}" class="d-block w-100" alt="Foto 2">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carrusel{{ forloop.counter }}" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carrusel{{ forloop.counter }}" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </div>
    {% endfor %}
{% endblock %}
